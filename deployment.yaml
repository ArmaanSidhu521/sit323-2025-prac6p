apiVersion: apps/v1
kind: Deployment
metadata:
  name: node-web
spec:
  replicas: 1
  selector:     
    matchLabels:
      app: node-web
  template:    
    metadata:
      labels:
        app: node-web 
    spec:
      containers:
        - name: node-web 
          image: armaansidhus224126633/6.1p 
          ports: 
            - containerPort: 8080 